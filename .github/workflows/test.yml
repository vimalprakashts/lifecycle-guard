name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # release.yml gates on this same matrix

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run lifecycle-guard tests (stdlib only)
        run: |
          set -e
          for t in plugins/lifecycle-guard/tests/test_*.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done
