name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # release.yml gates on this same matrix

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run lifecycle-guard tests (stdlib only)
        run: |
          set -e
          for t in plugins/lifecycle-guard/tests/test_*.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done
