name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # release.yml gates on this same matrix

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run lifecycle-guard tests (stdlib only)
        run: |
          set -e
          for t in plugins/lifecycle-guard/tests/test_*.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done
