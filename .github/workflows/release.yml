name: release

# Bumping "version" in plugins/lifecycle-guard/.claude-plugin/plugin.json on main publishes
# GitHub release v<version>, after the full test matrix passes. Idempotent: an existing tag is
# skipped, so a missed run is recovered by running this workflow manually on main (dry_run off).
on:
  push:
    branches: [main]
    paths:
      - plugins/lifecycle-guard/.claude-plugin/plugin.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the release notes; don't publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags for the notes

      - name: Read version
        id: version
        run: |
          v=$(python3 -c "import json; print(json.load(open('plugins/lifecycle-guard/.claude-plugin/plugin.json'))['version'])")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$v already exists, nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash .github/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        # only from main; a manual run publishes only when dry_run is switched off
        if: >-
          steps.version.outputs.exists == 'false' && github.ref == 'refs/heads/main' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG — lifecycle-guard" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
